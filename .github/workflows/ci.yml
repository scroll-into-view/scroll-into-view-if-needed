name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: lts
          cache: true
      # Fails when Vite+, its Vite core alias, and the Vitest pins drift apart (e.g. in a Renovate PR).
      # Fix it by running `vp migrate` and committing the result
      - run: vp migrate --no-interactive && git diff --exit-code
      # Format, lint, and type check (including the tests/typescript type tests)
      - run: vp check
      # Unused files, exports, and dependencies
      - run: vp exec knip
      - run: vp pack

  test:
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        node: [lts]
        include:
          - os: ubuntu-latest
            node: latest
    steps:
      - name: Set git to use LF
        if: matrix.os == 'windows-latest'
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: ${{ matrix.node }}
          cache: true
      # GitHub-hosted runners already have Chromium's system libraries, so skip
      # `--with-deps` (it runs apt-get, which is slow and can fail on mirror outages)
      - run: vp exec playwright install chromium
      - run: vp test --coverage
