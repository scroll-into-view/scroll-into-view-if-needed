name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read # for checkout

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # to push version commits, git tags and GitHub releases
      pull-requests: write # to open the "Version Packages" pull request
      id-token: write # for npm trusted publishing (OIDC) and provenance
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: lts
          cache: true
      - name: Create Release Pull Request or Publish to npm
        uses: changesets/action@v2
        with:
          publish-script: pnpm release
